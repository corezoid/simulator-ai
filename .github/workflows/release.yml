name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yml
  package:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Validate version and release provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          make build
          test "$(bin/simulator-ai --version | cut -d' ' -f2)" = "${RELEASE_TAG#v}"
      - name: Package the binary and plugin from the same commit
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              stage=$(mktemp -d)
              mkdir -p "$stage/bin"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -p=1 -trimpath -o "$stage/bin/simulator-ai" ./cmd/simulator-ai
              cp -R plugins .agents .claude-plugin docs "$stage/"
              cp README.md CHANGELOG.md SECURITY.md AGENTS.md CLAUDE.md "$stage/"
              tar -czf "dist/simulator-ai-${os}-${arch}.tar.gz" -C "$stage" .
              rm -rf "$stage"
            done
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          go version -m bin/simulator-ai > dist/build-info.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.sha }}
          path: dist/
          retention-days: 30
      - name: Stage release assets for sim-deploy publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes dist/*
      # Only sim-deploy publishes the verified draft after backend deployment.

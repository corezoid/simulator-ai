name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      results:
        description: Required CI job results for this workflow run
        value: ${{ jobs.gate.outputs.results }}
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOMAXPROCS: '2'
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make fmt-check mod-check check-source gen-check
      - uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.14.0
      - run: make test-cover build
      - run: bin/simulator-ai --version
      - name: Verify installable package and notices
        run: |
          scripts/package.sh linux/amd64 windows/amd64
          (cd dist && shasum -a 256 -c checksums.txt)
          mkdir -p "$RUNNER_TEMP/plugin-install"
          tar -xzf dist/simulator-ai-linux-amd64.tar.gz -C "$RUNNER_TEMP/plugin-install"
          test "$("$RUNNER_TEMP/plugin-install/bin/simulator-ai" --version)" = "$(bin/simulator-ai --version)"
          test -s "$RUNNER_TEMP/plugin-install/licenses/pdf/LICENSE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-${{ github.sha }}
          path: |
            coverage.out
            bin/simulator-ai
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-package-${{ github.sha }}
          path: |
            dist/simulator-ai-windows-amd64.zip
            dist/checksums.txt
          retention-days: 7
  windows:
    name: Windows package
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package-${{ github.sha }}
          path: dist
      - name: Verify ZIP and native MCP protocol
        shell: pwsh
        run: ./scripts/check-windows.ps1
  race:
    name: Race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make test-race
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make security
      - name: Scan git history for secrets (redacted)
        run: go run -p=1 github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: redacted-secret-scan-${{ github.sha }}
          path: ${{ runner.temp }}/gitleaks.json
          retention-days: 7
  gate:
    name: Gate
    if: always()
    needs: [quality, race, security, windows]
    outputs:
      results: ${{ steps.verdict.outputs.results }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        id: verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
          echo "results=$(echo "$RESULTS" | jq -c 'map_values(.result)')" >> "$GITHUB_OUTPUT"

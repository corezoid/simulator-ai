version: '2'
run:
  timeout: 5m
  concurrency: 2
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck
    - gosec
    - bodyclose
    - errorlint
    - nolintlint
  settings:
    staticcheck:
      checks: [all, "-QF*"] # Suggestions are not correctness gates.
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    paths:
      - internal/third_party/pdf
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]
      # Repository tooling reads/writes public artifacts and invokes git without a shell.
      - path: cmd/(gen-client|gen-cdu-reference|gen-graph-contract|gen-tool-catalog|quality-report|check-source)/
        linters: [gosec]
        text: 'G(204|304|306|703):'
formatters:
  enable: [gofmt]
